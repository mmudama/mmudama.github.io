baseurl = "http://mmudama.github.io/"
title = "Monique Mudama"
locale = "en"
defaultcontentlanguage = "en"


[pagination]
pagerSize = 20

[markup.highlight]
style = "github-dark"

[markup.goldmark.renderer]
  unsafe = true

[params]
  author = "Monique Mudama"
  info = "I make technology organizations smarter."
  since = 2023

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

# Social links (shown in the footer)
[[params.social]]
  name = "Connect on LinkedIn"
  url = "https://www.linkedin.com/in/moniquemudama/"

# Menu links
[[menu.main]]
  name = "Blog"
  weight = 1
  pageRef = "/posts"
[[menu.main]]
  name = "About"
  weight = 2
  pageRef = "/about"


[caches]
  [caches.images]
    dir = ':cacheDir/images'
