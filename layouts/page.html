{{ define "main" }}
{{ partial "title-band.html" (dict "title" .Title "page" . "narrow" (ne .Path "/about")) }}
{{ if eq .Path "/about" }}
<div class="wrap page about">
  {{ partial "portrait.html" . }}
  <article class="prose">
    {{ .Content }}  </article>
</div>
{{ else }}
<article class="wrap narrow page prose">
  {{ .Content }}
</article>
{{ end }}
{{ end }}
