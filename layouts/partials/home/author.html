<h1><a href="{{ relLangURL "about/" }}" class="title-link">{{ .Site.Params.author }}</a></h1>
{{ $infosize := .Site.Params.infosize | default "normal" }}
{{ if reflect.IsSlice .Site.Params.info }}
<h2 class="info info--{{ $infosize }}">{{ range .Site.Params.info }}{{ . | markdownify }}<br>{{ end}}</h2>
{{ else }}
<h2 class="info info--{{ $infosize }}">{{ .Site.Params.info | markdownify }} </h2>
{{ end }}
