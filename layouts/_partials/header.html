<header class="site-header">
  <nav class="wrap nav" aria-label="Main">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Params.author }}</a>
    <ul class="nav-links">
      {{- range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if eq .URL $.RelPermalink }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
</header>
