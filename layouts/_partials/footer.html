<footer class="site-footer">
  <div class="wrap footer-row">
    <span>© {{ with site.Params.since }}{{ . }}–{{ end }}{{ now.Year }} {{ site.Params.author }}</span>
    <nav aria-label="Footer">
      <ul class="nav-links">
        {{- range site.Menus.footer }}
        <li><a href="{{ .URL }}"{{ if eq .URL $.RelPermalink }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
        {{- range site.Params.social }}
        <li><a href="{{ .url }}" rel="me">{{ .name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</footer>
